# Local Kubernetes for testing the Helm charts. Host ports match the compose stack,
# except the app, which is served over TLS by the Gateway on 8443.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: casemgr
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30443, hostPort: 8443 } # Gateway (app)
      - { containerPort: 30180, hostPort: 8180 } # Keycloak
      - { containerPort: 30333, hostPort: 8333 } # SeaweedFS S3
      - { containerPort: 30025, hostPort: 8025 } # Mailpit
