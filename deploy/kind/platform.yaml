# Gateway class, Envoy service settings, and a self-signed certificate for the local
# cluster. Production uses a real ClusterIssuer (see docs/deployment.md).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# Exposes the casemgr Gateway on the node port that kind maps to localhost:8443.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: nodeport
  namespace: casemgr
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 443
                  nodePort: 30443
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: self-signed
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: casemgr-tls
  namespace: casemgr
spec:
  secretName: casemgr-tls
  dnsNames: [localhost]
  issuerRef:
    kind: ClusterIssuer
    name: self-signed
