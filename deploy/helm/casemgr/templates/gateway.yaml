apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "casemgr.labels" . | nindent 4 }}
  {{- with .Values.gateway.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ . }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  {{- with .Values.gateway.envoyProxy }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ . }}
  {{- end }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      {{- with .Values.gateway.hostname }}
      hostname: {{ . }}
      {{- end }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.tlsSecret }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "casemgr.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Release.Name }}
  tls:
    minVersion: "1.2"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "casemgr.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/ }
      backendRefs:
        - name: {{ .Release.Name }}-backend
          port: 8000
      # Evidence downloads stream large files through the API.
      timeouts:
        request: 3600s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "casemgr.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}-frontend
          port: 8080
---
# Envoy's local rate limit is one bucket per Envoy replica. For per-client limits,
# switch to Envoy Gateway's global rate limit (it needs Redis).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "casemgr.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Release.Name }}-api
  rateLimit:
    local:
      rules:
        - limit:
            requests: {{ .Values.gateway.apiRateLimit }}
            unit: Second
