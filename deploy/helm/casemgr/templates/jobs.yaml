# Schema migrations and bucket setup run before the new version's pods start.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "casemgr.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    {{- include "casemgr.jobPod" (dict "ctx" . "command" (list "alembic" "upgrade" "head") "role" "owner") | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-create-bucket
  labels:
    {{- include "casemgr.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    {{- include "casemgr.jobPod" (dict "ctx" . "command" (list "python" "-m" "app.jobs" "create_bucket")) | nindent 4 }}
{{- range $name, $schedule := .Values.jobs }}
{{- if $schedule }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $.Release.Name }}-{{ $name | replace "_" "-" }}
  labels:
    {{- include "casemgr.labels" $ | nindent 4 }}
spec:
  schedule: {{ $schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        {{- include "casemgr.jobPod" (dict "ctx" $ "command" (list "python" "-m" "app.jobs" $name)) | nindent 8 }}
{{- end }}
{{- end }}
