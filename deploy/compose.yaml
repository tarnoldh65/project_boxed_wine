# Local development stack. Credentials here are for local use only.
name: casemgr

services:
  postgres:
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: casemgr
      POSTGRES_PASSWORD: casemgr
      POSTGRES_DB: casemgr
    ports: ["5432:5432"]
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "casemgr"]
      interval: 2s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    command: server -s3 -dir=/data
    ports: ["8333:8333"]
    volumes: [s3:/data]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Browsers use localhost:8180; the backend reaches token and userinfo endpoints at keycloak:8080.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["8180:8080"]
    volumes: [./keycloak:/opt/keycloak/data/import:ro]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 60

  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports: ["8025:8025", "1025:1025"]

  # Intake mailbox for the email_intake job: SMTP 3025 in, IMAP 3143 out; any password works.
  greenmail:
    image: greenmail/standalone:2.1.15@sha256:309ba544ea482e5d4265d09921cdab07c8dad2cc4481d715c9b8ff5d3f0a149f
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    ports: ["3025:3025", "3143:3143"]

  migrate:
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    environment:
      CASEMGR_MIGRATION_DATABASE_URL: postgresql+asyncpg://casemgr:casemgr@postgres:5432/casemgr
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    build: ../backend
    environment:
      CASEMGR_DATABASE_URL: postgresql+asyncpg://casemgr_app:casemgr_app@postgres:5432/casemgr
      CASEMGR_OIDC_METADATA_URL: http://keycloak:8080/realms/casemgr/.well-known/openid-configuration
      CASEMGR_OIDC_CLIENT_SECRET: dev-only-client-secret
      CASEMGR_SECRET_KEY: dev-only-secret-key
      # Re-read IdP groups on every request so revocation is immediate (and testable) in dev.
      CASEMGR_GROUP_SYNC_MINUTES: "0"
      CASEMGR_IMAP_URL: imap://intake%40example.test:intake@greenmail:3143/INBOX
      CASEMGR_IMAP_TENANT: detect-respond
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 2s
      retries: 30

  frontend:
    build: ../frontend
    environment:
      CASEMGR_API_UPSTREAM: http://backend:8000
    ports: ["8080:8080"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  postgres:
  s3:
