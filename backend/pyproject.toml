[project]
name = "casemgr"
version = "0.1.0"
description = "Cyber incident response case management API"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "authlib>=1.9.1",
    "boto3>=1.43.118",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "pyzipper>=0.4.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["app", "tests", "migrations"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "testcontainers[postgres]>=4.15.0",
]

