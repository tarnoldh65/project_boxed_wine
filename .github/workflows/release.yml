name: Release

# Pushing a tag such as v1.2.0 publishes signed images with SBOM attestations and
# creates a GitHub release carrying the SBOMs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write # keyless signing with the workflow's OIDC identity
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build and push
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/casemgr-$COMPONENT:${GITHUB_REF_NAME#v}"
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build -t "$image" "$COMPONENT"
          docker push "$image"
          echo "ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.ref }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json
          artifact-name: sbom-${{ matrix.component }}.spdx.json
      - name: Sign and attest the SBOM
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate "sbom-$COMPONENT.spdx.json" "$REF"
          echo "$REF" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes sbom-*.spdx.json
